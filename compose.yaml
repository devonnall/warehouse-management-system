x-environment: &default-env
  environment:
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DB: ${POSTGRES_DB}

services:
  postgres:
    image: postgres:18.6-alpine3.23
    container_name: ${PROJECT_NAME}-postgres
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/18/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    <<: *default-env
  migrations:
    image: flyway/flyway:latest
    container_name: ${PROJECT_NAME}-flyway
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations:/flyway/sql
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CLEAN_DISABLED: "false"
    command: ${FLYWAY_COMMAND:-migrate}
  server:
    container_name: ${PROJECT_NAME}-sever
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET}
      BASE_URL: ${BASE_URL}
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - postgres
    <<: *default-env

volumes:
  postgres_data:
  server_node_modules:
